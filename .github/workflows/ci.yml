name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off
      - run: python -m compileall -q api config crawlers scripts storage
      - run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - name: Verify API and integrated frontend
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/compare?country=TW > /dev/null
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<div id="app"></div>'

      - run: bash -n deploy/install.sh deploy/deploy.sh
